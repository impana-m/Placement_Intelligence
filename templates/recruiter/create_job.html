{% extends "base.html" %}
{% block title %}Post Campus Job | Recruiter Portal{% endblock %}
{% block page_title %}Publish New Campus Placement Opening{% endblock %}

{% block content %}
<div class="card" style="max-width: 760px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('recruiter.create_job') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label">Position / Job Title</label>
      <input type="text" name="title" class="form-control" placeholder="e.g. Graduate Software Engineer - Cloud" required>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Role Type</label>
        <select name="role_type" class="form-control">
          <option value="Full-Time">Full-Time</option>
          <option value="Internship">Internship</option>
          <option value="Internship + PPO">Internship + PPO</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Job Location</label>
        <input type="text" name="location" class="form-control" placeholder="Bangalore, Hyderabad" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Salary Package String</label>
        <input type="text" name="salary_package" class="form-control" placeholder="e.g. 8.5 - 10 LPA" required>
      </div>

      <div class="form-group">
        <label class="form-label">Salary Numeric (LPA for Analytics)</label>
        <input type="number" step="0.1" name="salary_numeric" class="form-control" value="8.5" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Minimum CGPA Requirement</label>
      <input type="number" step="0.1" name="min_cgpa" class="form-control" value="7.0" required>
    </div>

    <div class="form-group">
      <label class="form-label">Required Skills (Comma Separated)</label>
      <input type="text" name="required_skills" class="form-control" placeholder="Python, SQL, Flask" required>
    </div>

    <div class="form-group">
      <label class="form-label">Preferred / Good-to-Have Skills</label>
      <input type="text" name="preferred_skills" class="form-control" placeholder="Docker, AWS">
    </div>

    <div class="form-group">
      <label class="form-label">Role Description & Responsibilities</label>
      <textarea name="description" class="form-control" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Campus Drive</button>
  </form>
</div>
{% endblock %}
